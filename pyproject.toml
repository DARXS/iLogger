[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangue-logger"
version = "8.0.0"
description = "App de telemetria automotiva (Baja SAE): traços sincronizados, delta de tempo, mini-setores, CVT, replay e relatórios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.11", "pandas>=2.0",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
  "xlsxwriter>=3.1", "reportlab>=4.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.5", "PyQt6-WebEngine>=6.5"]          # janela própria (opcional); sem isso abre no navegador
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "openpyxl>=3.1", "ruff>=0.5", "mypy>=1.10", "pandas-stubs",
       "PyQt6>=6.5", "PyQt6-WebEngine>=6.5", "pillow"]

[project.scripts]
mangue-logger = "mangue_logger.cli:main"

[project.gui-scripts]
mangue-logger-gui = "mangue_logger.web.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mangue_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/mangue_logger/web/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/mangue_logger/infrastructure/exporters/*.py" = ["E402", "E701", "E702", "E741", "F841", "I001", "SIM", "B", "UP", "RUF", "F401"]
"tests/*" = ["B", "RUF", "E702", "E701", "E401", "E402", "SIM115", "SIM117", "E731", "I001", "N802"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/mangue_logger/domain", "src/mangue_logger/application", "src/mangue_logger/web"]
exclude = ['web/desktop[.]py']

[[tool.mypy.overrides]]
module = ["PyQt6.*", "PIL.*", "matplotlib.*", "reportlab.*", "xlsxwriter.*"]
follow_imports = "skip"
ignore_errors = true
